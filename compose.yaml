services:
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    container_name: ergo-irc
    ports:
      - "6667:6667"
    volumes:
      - ./docker-configs/ergo:/ircd
    # Skip the image's run.sh which calls `ergo mkcerts` and exits when no TLS
    # listener is configured. We use plaintext :6667 only for local testing.
    command: ["/ircd-bin/ergo", "run", "--conf", "/ircd/ircd.yaml"]
    restart: unless-stopped
    networks:
      - bridgenet

  sshchat:
    build: ./docker-configs/sshchat
    container_name: sshchat
    ports:
      - "2022:2022"
    volumes:
      - ./docker-configs/sshchat:/data
      - ~/.ssh:/root/.ssh:ro
    command:
      [
        "./ssh-chat/ssh-chat",
        "--bind",
        "0.0.0.0:2022",
        "--motd",
        "/data/motd.txt",
      ]
    restart: unless-stopped
    networks:
      - bridgenet

  matterbridge:
    build: .
    container_name: matterbridge
    volumes:
      - ./matterbridge.toml:/etc/matterbridge/matterbridge.toml:ro
    depends_on:
      - ergo
      - sshchat
    restart: unless-stopped
    networks:
      - bridgenet
    command: ["-debug", "-conf", "/etc/matterbridge/matterbridge.toml"]

networks:
  bridgenet:
    driver: bridge
